<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="An interactive Path Finder Visualizer built using BFS and Dijkstra’s Algorithm. Visualize graph traversal and shortest paths dynamically.">
  <meta name="author" content="Abhishek Singh">
  <title>Path Finder Visualizer | BFS & Dijkstra</title>
  
  <!-- Favicon (Optional) -->
  <link rel="icon" href="gifs/footer.gif" type="image/gif">

  <!-- Stylesheet -->
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <!-- 🧭 HEADER -->
  <header>
    <div id="header-gif">
      <img src="gifs/header.gif" alt="Animated Background Header" loading="lazy" />
    </div>
    <h1>🧭 Path Finder Visualizer</h1>
    <p>Visualizing BFS & Dijkstra Algorithms in Action</p>
  </header>

  <!-- ⚙️ CONTROL PANEL -->
  <section id="controls">
    <select id="algoSelect" aria-label="Select Algorithm">
      <option value="bfs">Breadth First Search (BFS)</option>
      <option value="dijkstra">Dijkstra’s Algorithm (Weighted)</option>
    </select>
    <button id="setStart">Set Start</button>
    <button id="setEnd">Set End</button>
    <button id="addWalls">Add Walls</button>
    <button id="toggleWeights">Toggle Weights</button>
    <button id="visualize">Visualize</button>
    <button id="reset">Reset</button>
  </section>

  <!-- 📊 STATUS BAR -->
  <div id="status" role="status" aria-live="polite">
    Algorithm: <strong>BFS</strong> | Steps: <strong>0</strong> | Path Length: <strong>0</strong>
  </div>

  <!-- 🧩 GRID CONTAINER -->
  <main>
    <div id="grid"></div>
  </main>

  <!-- ⏳ LOADER -->
  <div id="loader" style="display:none;" aria-hidden="true">
    <img src="gifs/loader.gif" alt="Algorithm Running..." />
    <p>Algorithm Running...</p>
  </div>

  <!-- 🚫 NO PATH FOUND -->
  <div id="noPathPopup" style="display:none;" aria-hidden="true">
    <img src="gifs/nopath.gif" alt="No Path Found Animation" />
    <p>No Path Found!</p>
  </div>

  <!-- 🌟 FOOTER -->
  <footer>
    <p>Made with ❤️ by Abhishek Ranjan using Core DSA Concepts – <strong>BFS & Dijkstra</strong></p>
    <img src="gifs/footer.gif" alt="Animated Footer Graphic" loading="lazy" />
  </footer>

  <!-- ⚡ SCRIPT -->
  <script src="script.js" defer></script>
</body>
</html>
